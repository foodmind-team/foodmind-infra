name: Staging DAST

on:
  workflow_run:
    workflows: [Deploy staging]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodmind-staging-dast
  cancel-in-progress: false

jobs:
  staging-dast:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require hardened response headers
        env:
          TARGET_URL: ${{ vars.STAGING_BASE_URL }}
        run: |
          set -euo pipefail
          [[ "${TARGET_URL}" =~ ^https://[^[:space:]]+$ ]]
          ./scripts/check-security-headers.sh "${TARGET_URL}"

      - name: Run OWASP ZAP passive baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.STAGING_BASE_URL }}
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef
          rules_file_name: .zap/rules.tsv
          cmd_options: -a
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-${{ github.sha }}
