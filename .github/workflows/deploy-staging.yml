name: Deploy staging

on:
  workflow_run:
    workflows: [Publish staging images]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Successful Publish staging images workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: foodmind-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Resolve image publication run
        id: publication
        env:
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_RUN_ID: ${{ inputs.publish_run_id }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            run_id="${WORKFLOW_RUN_ID}"
          else
            run_id="${DISPATCH_RUN_ID}"
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download published release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-release
          path: ${{ runner.temp }}/release-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.publication.outputs.run_id }}

      - name: Resolve tested infrastructure revision
        id: revision
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/release-artifact/release-manifest.json"
          [[ -f "${manifest}" ]]
          revision="$(jq -r '.source_revisions.infra' "${manifest}")"
          [[ "${revision}" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=${revision}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          submodules: false

      - name: Validate promoted image digests
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          ./scripts/cd/validate-release-manifest.sh "${RUNNER_TEMP}/release-artifact/release-manifest.json" "${AWS_ACCOUNT_ID}" "${AWS_REGION}"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Snapshot RDS when the release declares migrations
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          DB_INSTANCE_ID: ${{ vars.AWS_DB_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ "$(jq -r '.database_migrations' "${RUNNER_TEMP}/release-artifact/release-manifest.json")" != "true" ]]; then
            echo "Release declares no database migrations; snapshot gate skipped."
            exit 0
          fi
          snapshot_id="foodmind-staging-$(date -u +%Y%m%d%H%M%S)-${GITHUB_RUN_ID}"
          aws rds create-db-snapshot \
            --db-instance-identifier "${DB_INSTANCE_ID}" \
            --db-snapshot-identifier "${snapshot_id}" \
            --region "${AWS_REGION}" \
            --no-cli-pager >/dev/null
          aws rds wait db-snapshot-available \
            --db-snapshot-identifier "${snapshot_id}" \
            --region "${AWS_REGION}" \
            --no-cli-pager
          echo "Created migration safety snapshot: ${snapshot_id}"

      - name: Deploy tested release through Systems Manager
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
          INFRA_REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          manifest_base64="$(base64 -w 0 "${RUNNER_TEMP}/release-artifact/release-manifest.json")"
          [[ "${INFRA_REVISION}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${manifest_base64}" =~ ^[A-Za-z0-9+/=]+$ ]]

          runtime_dir="/opt/foodmind/cd-runtime/${INFRA_REVISION}"
          commands="$(jq -cn \
            --arg revision "${INFRA_REVISION}" \
            --arg runtime "${runtime_dir}" \
            --arg manifest "${manifest_base64}" \
            '{commands: [
              "set -eu",
              "repo=/opt/foodmind/foodmind-infra",
              "test -d ${repo}/.git",
              "git -c safe.directory=${repo} -C ${repo} fetch --no-tags origin " + $revision,
              "if [ ! -d " + $runtime + " ]; then mkdir -p /opt/foodmind/cd-runtime && git -c safe.directory=${repo} -C ${repo} worktree add --detach " + $runtime + " " + $revision + "; fi",
              "printf %s " + $manifest + " | base64 --decode > " + $runtime + "/release-manifest.json",
              "chmod 600 " + $runtime + "/release-manifest.json",
              $runtime + "/scripts/cd/deploy-staging.sh " + $runtime + "/release-manifest.json /opt/foodmind/foodmind-infra/.env.aws"
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "GitHub ${GITHUB_REPOSITORY}@${INFRA_REVISION}" \
            --parameters "${commands}" \
            --query 'Command.CommandId' \
            --output text \
            --region "${AWS_REGION}" \
            --no-cli-pager)"

          deadline=$((SECONDS + 2400))
          status=Pending
          while (( SECONDS < deadline )); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query Status \
              --output text \
              --region "${AWS_REGION}" \
              --no-cli-pager 2>/dev/null || true)"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          invocation="$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --output json \
            --region "${AWS_REGION}" \
            --no-cli-pager)"
          jq -r '.StandardOutputContent, .StandardErrorContent' <<<"${invocation}"
          final_status="$(jq -r '.Status' <<<"${invocation}")"
          [[ "${final_status}" == "Success" ]]

      - name: Record deployment summary
        if: success()
        run: |
          {
            echo "### FoodMind staging deployment"
            echo
            echo "- Release: \`$(jq -r '.release_id' "${RUNNER_TEMP}/release-artifact/release-manifest.json")\`"
            echo "- Infra revision: \`${{ steps.revision.outputs.sha }}\`"
            echo "- All seven application images were deployed by immutable ECR digest."
          } >> "${GITHUB_STEP_SUMMARY}"
