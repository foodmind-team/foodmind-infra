name: Compose integration

on:
  pull_request:
  push:
    branches: [master]
    paths:
      - '.github/workflows/compose.yml'
      - '.github/workflows/deploy-staging.yml'
      - '.github/workflows/publish-staging.yml'
      - '.env.example'
      - '.env.aws.example'
      - '.gitmodules'
      - 'cloudformation.github-actions-cd.yaml'
      - 'compose.yaml'
      - 'compose.aws-demo.yaml'
      - 'releases/**'
      - 'scripts/**'
      - 'services/**'
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

concurrency:
  group: compose-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")"
          else
            echo "compose=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '(^\.github/workflows/compose\.yml$|^\.env\.example$|^\.gitmodules$|^compose\.yaml$|^scripts/|^services/)' <<< "$changed_files"; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Render Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Compose safety policy
        run: docker compose --env-file .env.example config --format json | python3 scripts/check-compose-policy.py compose.yaml -
      - name: Scan tracked files for common credential forms
        run: python3 scripts/check-secrets.py
      - name: Validate staging delivery contract
        run: |
          set -euo pipefail
          bash -n scripts/check-aws-env.sh scripts/verify-aws-demo.sh scripts/cd/*.sh
          docker compose --env-file .env.aws.example -f compose.aws-demo.yaml config --quiet
          ./scripts/cd/validate-release-manifest.sh releases/staging.example.json 076648863731 ap-southeast-1
          ./scripts/cd/validate-release-source.sh releases/staging-source.json

  stack-smoke:
    needs: [changes, validate]
    if: needs.validate.result == 'success' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && needs.changes.outputs.compose == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Build and start offline stack
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 240
      - name: Verify Backend readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness
      - name: Collect service state
        if: always()
        run: |
          mkdir -p ci-evidence
          docker compose ps --format json | tee ci-evidence/compose-ps.json
          docker compose logs --no-color --tail=200 | tee ci-evidence/compose.log
      - name: Upload Compose diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compose-integration-${{ github.sha }}
          path: ci-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  compose-gate:
    if: always()
    needs: [changes, validate, stack-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require validation and any applicable smoke test
        shell: bash
        run: |
          set -euo pipefail
          test "${{ needs.validate.result }}" = success
          if [[ "${{ needs.changes.outputs.compose }}" == true && "${{ github.event_name }}" == pull_request && "${{ github.event.pull_request.draft }}" == false ]]; then
            test "${{ needs.stack-smoke.result }}" = success
          elif [[ "${{ github.event_name }}" != pull_request ]]; then
            test "${{ needs.stack-smoke.result }}" = success
          else
            test "${{ needs.stack-smoke.result }}" = skipped
          fi
