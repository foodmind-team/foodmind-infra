name: Compose integration

on:
  pull_request:
    paths:
      - '.github/workflows/compose.yml'
      - '.env.example'
      - '.gitmodules'
      - 'compose.yaml'
      - 'scripts/**'
      - 'services/**'
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Render Compose configuration
        run: docker compose --env-file .env.example config --quiet

  stack-smoke:
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and start offline stack
        run: docker compose --env-file .env.example up --build -d --wait --wait-timeout 240
      - name: Verify Backend readiness
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness
      - name: Collect service state
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
