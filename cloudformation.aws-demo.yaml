AWSTemplateFormatVersion: '2010-09-09'
Description: FoodMind single-instance AWS demo in Singapore with private RDS PostgreSQL.

Parameters:
  AlertEmail:
    Type: String
    Description: Operational email for the AWS budget and ACME notices.
    AllowedPattern: '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$'
    ConstraintDescription: Enter a valid operational email address.
  OneMapCredentialsSecretArn:
    Type: String
    Default: ''
    Description: Exact ARN of the JSON OneMap credentials secret. Leave empty until provisioned.
    AllowedPattern: '^$|^arn:aws:secretsmanager:ap-southeast-1:[0-9]{12}:secret:foodmind/staging/onemap-[A-Za-z0-9]{6}$'
    ConstraintDescription: Use the exact ap-southeast-1 foodmind/staging/onemap secret ARN or leave empty.

Conditions:
  HasOneMapCredentialsSecret: !Not [!Equals [!Ref OneMapCredentialsSecretArn, '']]

Resources:
  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: foodmind-demo-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref DemoVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: foodmind-demo-public-a

  PrivateDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.10.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: foodmind-demo-db-a

  PrivateDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DemoVpc
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.11.0/24
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: foodmind-demo-db-b

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Name
          Value: foodmind-demo-public

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS only for the FoodMind demo.
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP for ACME and redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS application traffic
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
          Description: Package registries, AWS APIs, DNS, and private RDS
      Tags:
        - Key: Name
          Value: foodmind-demo-app

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from the FoodMind EC2 security group only.
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: PostgreSQL from application host
      Tags:
        - Key: Name
          Value: foodmind-demo-db

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the FoodMind demo database.
      SubnetIds:
        - !Ref PrivateDbSubnetA
        - !Ref PrivateDbSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: foodmind-demo-db
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MaxAllocatedStorage: 40
      StorageType: gp3
      StorageEncrypted: true
      DBName: foodmind
      MasterUsername: foodmind_admin
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      Tags:
        - Key: Name
          Value: foodmind-demo-db

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Sub 'https://${FoodMindEip}.sslip.io'
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
              - x-amz-checksum-sha256
            ExposedHeaders:
              - ETag
              - x-amz-checksum-sha256
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: foodmind-demo-media

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: foodmind-demo-ec2-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: FoodMindDemoRuntime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadDatabaseSecret
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn
              - !If
                - HasOneMapCredentialsSecret
                - Sid: ReadOneMapCredentials
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref OneMapCredentialsSecretArn
                - !Ref AWS::NoValue
              - Sid: MediaObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${MediaBucket.Arn}/media/*'
              - Sid: ListMediaPrefix
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt MediaBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: media/*

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref AppRole

  FoodMindEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: foodmind-demo

  AppInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.large
      IamInstanceProfile: !Ref AppInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 50
            Encrypted: true
            DeleteOnTermination: true
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      Monitoring: false
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/foodmind-bootstrap.log | logger -t foodmind-bootstrap -s 2>/dev/console) 2>&1
          # Amazon Linux 2023 already ships curl-minimal; installing the full
          # curl package conflicts with it and aborts cloud-init.
          dnf install -y docker git jq openssl
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl --fail --location --silent --show-error \
            https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 \
            --output /usr/local/lib/docker/cli-plugins/docker-compose
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          curl --fail --location --silent --show-error \
            https://github.com/docker/buildx/releases/download/v0.36.1/buildx-v0.36.1.linux-amd64 \
            --output /usr/local/lib/docker/cli-plugins/docker-buildx
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-buildx
          fallocate -l 4G /swapfile
          chmod 0600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          mkdir -p /opt/foodmind
          printf '%s\n' ready > /opt/foodmind/bootstrap.status
      Tags:
        - Key: Name
          Value: foodmind-demo-app

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt FoodMindEip.AllocationId
      InstanceId: !Ref AppInstance

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: foodmind-demo-monthly-110
        BudgetLimit:
          Amount: 110
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

Outputs:
  InstanceId:
    Value: !Ref AppInstance
  PublicIp:
    Value: !Ref FoodMindEip
  TemporaryDomain:
    Value: !Sub '${FoodMindEip}.sslip.io'
  ApplicationUrl:
    Value: !Sub 'https://${FoodMindEip}.sslip.io'
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  MediaBucketName:
    Value: !Ref MediaBucket
